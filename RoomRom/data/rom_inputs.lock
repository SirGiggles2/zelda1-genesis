# RoomRom Z1 ROM input pin file
#
# Atlas pipeline (north-star spec 2026-05-01-roomrom-z1-full-atlas-design.md
# Phase 0) requires deterministic ROM inputs. Tools/extract_z1_prg_chr.py
# refuses to run if the input ROM SHA-256 does not match this file.
#
# Format: <variant_id> <sha256> <byte_count> <rel_path_from_repo_root>
# Comments (#) and blank lines ignored.
#
# Both ROMs are 131088 bytes = 16-byte iNES header + 8 PRG x 16KB = 131088.
# CHR ROM = 0 banks (CHR RAM); pattern data lives in PRG ROM as INCBIN
# blocks copied/transferred into CHR RAM at scene-load time.

